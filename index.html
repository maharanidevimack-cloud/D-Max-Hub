<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-MAX HUB</title>
    <style>
        /* Apple Style Fixed Container Design */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .system-hub-card {
            width: 100%;
            max-width: 420px;
            height: 88vh;
            background: #ffffff;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .hub-header {
            background: #ffffff;
            color: #1d1d1f;
            padding: 18px 20px 8px 20px;
            text-align: center;
            flex-shrink: 0;
        }
        .hub-header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Premium iOS Search Bar */
        .search-box {
            padding: 8px 20px 12px 20px;
            background: #ffffff;
            display: flex;
            justify-content: center;
            flex-shrink: 0;
        }
        .search-box input {
            width: 100%;
            padding: 11px 16px;
            border-radius: 12px;
            border: none;
            background: #f5f5f7;
            outline: none;
            font-size: 14px;
            color: #1d1d1f;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }
        .search-box input::placeholder {
            color: #86868b;
        }

        /* Scrollable Container for Ads & Apps */
        .scroll-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 0 16px 16px 16px;
            background: #ffffff;
        }
        .scroll-container::-webkit-scrollbar {
            width: 4px;
        }
        .scroll-container::-webkit-scrollbar-thumb {
            background: #e1e1e6;
            border-radius: 10px;
        }

        /* Compact Ad Box */
        .ad-card-wrapper {
            background: #fbfbfd;
            border: 1px solid #f5f5f7;
            border-radius: 14px;
            padding: 8px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* App Grid Container */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            padding-bottom: 10px;
        }
        .app-icon-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-align: center;
            transition: transform 0.15s ease;
        }
        .app-icon-card:active {
            transform: scale(0.92);
        }
        .icon-box {
            width: 54px;
            height: 54px;
            background: #ffffff;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.04);
            overflow: hidden;
        }
        .icon-box img {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }
        .app-name {
            font-size: 11px;
            color: #1d1d1f;
            font-weight: 500;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="system-hub-card">
        <div class="hub-header">
            <h1>D-MAX HUB</h1>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search apps & websites..." autocomplete="off">
        </div>

        <div class="scroll-container">
            <!-- Adsterra Ad Integration Wrapper -->
            <div class="ad-card-wrapper">
                <script async="async" data-cfasync="false" src="https://pl31114156.profitableratecpmnetwork.com/efa5203814bbbf08c0d52a9e7cf635dc/invoke.js"></script>
                <div id="container-efa5203814bbbf08c0d52a9e7cf635dc"></div>
            </div>

            <!-- Apps Container -->
            <div class="app-grid" id="appGrid">
                <!-- Apps will load dynamically via script.js -->
            </div>
        </div>
    </div>

    <!-- Link your JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
