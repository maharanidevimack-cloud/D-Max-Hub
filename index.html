<!DOCTYPE html>
<html lang="hi">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
       <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>D-Max Hub</title>
    
    <!-- CSS File Link -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* Secret Admin Analytics Modal Design */
        #adminModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; align-items: center; justify-content: center; }
        .admin-box { background: #ffffff; padding: 25px; border-radius: 20px; width: 85%; max-width: 300px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .admin-box h3 { margin-bottom: 15px; color: #1e293b; font-size: 18px; }
        .stat-row { background: #f8fafc; padding: 12px; border-radius: 10px; margin: 10px 0; font-size: 14px; border: 1px solid #e2e8f0; color: #334155; }
        .close-admin { background: #7c3aed; color: white; border: none; padding: 8px 20px; border-radius: 10px; margin-top: 15px; cursor: pointer; font-weight: bold; }
    </style>

    <!-- Service Worker Script -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(() => console.log('Update system active'))
                    .catch(err => console.log('Error', err));
            });
        }
    </script>
</head>
<body>

    <div class="system-hub-card">
        <div class="hub-header">
            <!-- 12-15 baar tap karne ke liye ID di gayi hai -->
            <h1 id="secretTitle" style="cursor: pointer; user-select: none;">D-Max Hub</h1>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search apps or web tools..." onkeyup="filterApps()">
        </div>

        <div class="scroll-container" id="scrollContainer">
            <div class="grid" id="appGrid">
                <!-- Apps dynamically render honge -->
            </div>
        </div>
    </div>

    <!-- Secret Hidden Analytics Modal (Sirf aapke liye) -->
    <div id="adminModal">
        <div class="admin-box">
            <h3>📊 Live Analytics</h3>
            <div class="stat-row">Home Screen Adds: <strong id="totalInstalls">0</strong></div>
            <div class="stat-row">Status: <strong style="color: green;">Active & Secured</strong></div>
            <button class="close-admin" onclick="closeAdmin()">Close</button>
        </div>
    </div>

    <!-- Floating Side Trigger Button -->
    <div id="side-trigger" style="position: fixed; right: 0; top: 50%; transform: translateY(-50%); background: #111; color: #fff; padding: 12px 6px; border-radius: 8px 0 0 8px; cursor: pointer; z-index: 9998; font-weight: bold; writing-mode: vertical-rl; font-family: sans-serif; box-shadow: -2px 0 10px rgba(0,0,0,0.3);">D-MAX</div>

    <!-- JavaScript File Link -->
    <script src="script.js"></script>

    <script>
        // Secret Multi-Tap System (12 se 15 baar tap hone par hi khulega)
        let tapCount = 0;
        let resetTimer = null;

        document.getElementById('secretTitle').addEventListener('click', () => {
            tapCount++;
            
            clearTimeout(resetTimer);
            resetTimer = setTimeout(() => {
                tapCount = 0;
            }, 2000);

            if (tapCount >= 13) {
                tapCount = 0;
                let storedCount = localStorage.getItem('dmax_hub_installs') || 0;
                document.getElementById('totalInstalls').innerText = storedCount;
                document.getElementById('adminModal').style.display = 'flex';
            }
        });

        function closeAdmin() {
            document.getElementById('adminModal').style.display = 'none';
        }

        window.addEventListener('appinstalled', () => {
            let current = parseInt(localStorage.getItem('dmax_hub_installs') || 0) + 1;
            localStorage.setItem('dmax_hub_installs', current);
        });

        // Floating Side Trigger Click Handler (Center Popup Logic)
        document.getElementById('side-trigger').addEventListener('click', () => {
            const hubCard = document.querySelector('.system-hub-card');
            hubCard.style.position = 'fixed';
            hubCard.style.top = '50%';
            hubCard.style.left = '50%';
            hubCard.style.transform = 'translate(-50%, -50%)';
            hubCard.style.zIndex = '10000';
            hubCard.style.boxShadow = '0 20px 40px rgba(0,0,0,0.4)';
            
            let overlay = document.getElementById('screen-overlay');
            if(!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'screen-overlay';
                overlay.style.position = 'fixed';
                overlay.style.top = '0';
                overlay.style.left = '0';
                overlay.style.width = '100%';
                overlay.style.height = '100%';
                overlay.style.background = 'rgba(0,0,0,0.4)';
                overlay.style.zIndex = '9999';
                document.body.appendChild(overlay);
                
                overlay.addEventListener('click', () => {
                    hubCard.style.position = '';
                    hubCard.style.top = '';
                    hubCard.style.left = '';
                    hubCard.style.transform = '';
                    hubCard.style.zIndex = '';
                    overlay.remove();
                });
            }
        });
    </script>
</body>
</html>
