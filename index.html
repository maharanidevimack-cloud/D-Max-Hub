<!DOCTYPE html>
<html lang="hi">
<head>    
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>D-Max Hub</title>
    
    <!-- CSS File Link -->
    <link rel="stylesheet" href="style.css">

    <!-- Adsterra Native Banner Script Code -->
    <script async="async" data-cfasync="false" src="https://pl31114156.profitableratecpmnetwork.com/efa5203814bbbf08c0d52a9e7cf635dc/invoke.js"></script>

    <style>
        /* Responsive Hub Styles for PC, Laptop & Mobile */
        body { margin: 0; padding: 0; background: #0f172a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .system-hub-card { width: 100%; max-width: 1200px; background: #ffffff; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); overflow: hidden; display: flex; flex-direction: column; height: 90vh; margin: 20px; }
        .hub-header { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; padding: 20px; text-align: center; }
        .hub-header h1 { margin: 0; font-size: 24px; font-weight: bold; }
        .search-box { padding: 15px 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: center; }
        .search-box input { width: 100%; max-width: 500px; padding: 12px 20px; border-radius: 30px; border: 1px solid #cbd5e1; outline: none; font-size: 15px; }
        .scroll-container { flex: 1; overflow-y: auto; padding: 20px; background: #f1f5f9; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; }
        .app-icon-card { background: white; padding: 15px 10px; border-radius: 15px; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s, box-shadow 0.2s; user-select: none; }
        .app-icon-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        .icon-box { width: 50px; height: 50px; border-radius: 12px; overflow: hidden; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; background: #f1f5f9; }
        .icon-box img { width: 100%; height: 100%; object-fit: contain; }
        .app-name { font-size: 13px; font-weight: 600; color: #334155; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

        /* Secret Admin Analytics Modal Design */
        #adminModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; align-items: center; justify-content: center; }
        .admin-box { background: #ffffff; padding: 25px; border-radius: 20px; width: 85%; max-width: 300px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .admin-box h3 { margin-bottom: 15px; color: #1e293b; font-size: 18px; }
        .stat-row { background: #f8fafc; padding: 12px; border-radius: 10px; margin: 10px 0; font-size: 14px; border: 1px solid #e2e8f0; color: #334155; }
        .close-admin { background: #7c3aed; color: white; border: none; padding: 8px 20px; border-radius: 10px; margin-top: 15px; cursor: pointer; font-weight: bold; }
    </style>

    <!-- Service Worker Script -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(() => console.log('Update system active'))
                    .catch(err => console.log('Error', err));
            });
        }
    </script>
</head>
<body>

    <div class="system-hub-card">
        <div class="hub-header">
            <!-- 13 baar tap karne par admin analytics khulega -->
            <h1 id="secretTitle" style="cursor: pointer; user-select: none;">D-Max Hub</h1>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search apps or web tools..." onkeyup="filterApps()">
        </div>

        <div class="scroll-container" id="scrollContainer">
            <!-- Adsterra Native Banner Container -->
            <div id="container-efa5203814bbbf08c0d52a9e7cf635dc" style="margin-bottom: 20px; text-align: center;"></div>
            
            <div class="grid" id="appGrid">
                <!-- Apps dynamically render honge -->
            </div>
        </div>
    </div>

    <!-- Secret Hidden Analytics Modal -->
    <div id="adminModal">
        <div class="admin-box">
            <h3>📊 Live Analytics</h3>
            <div class="stat-row">Home Screen Adds: <strong id="totalInstalls">0</strong></div>
            <div class="stat-row">Status: <strong style="color: green;">Active & Secured</strong></div>
            <button class="close-admin" onclick="closeAdmin()">Close</button>
        </div>
    </div>

    <!-- JavaScript File Link -->
    <script src="script.js"></script>

    <script>
        // Secret Multi-Tap System (13 baar tap hone par khulega)
        let tapCount = 0;
        let resetTimer = null;

        document.getElementById('secretTitle').addEventListener('click', () => {
            tapCount++;
            clearTimeout(resetTimer);
            resetTimer = setTimeout(() => { tapCount = 0; }, 2000);

            if (tapCount >= 13) {
                tapCount = 0;
                let storedCount = localStorage.getItem('dmax_hub_installs') || 0;
                document.getElementById('totalInstalls').innerText = storedCount;
                document.getElementById('adminModal').style.display = 'flex';
            }
        });

        function closeAdmin() {
            document.getElementById('adminModal').style.display = 'none';
        }

        window.addEventListener('appinstalled', () => {
            let current = parseInt(localStorage.getItem('dmax_hub_installs') || 0) + 1;
            localStorage.setItem('dmax_hub_installs', current);
        });
    </script>
</body>
</html>
