<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-MAX HUB</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .hub-container {
            background: #1e293b;
            width: 100%;
            max-width: 450px;
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .hub-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .hub-header h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 15px;
        }
        .search-box {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 20px;
            padding-right: 40px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus {
            border-color: #38bdf8;
        }
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .app-grid::-webkit-scrollbar {
            width: 5px;
        }
        .app-grid::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        .app-icon-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s;
        }
        .app-icon-card:hover {
            transform: scale(1.05);
        }
        .icon-box {
            width: 55px;
            height: 55px;
            background: #0f172a;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }
        .icon-box img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }
        .app-name {
            font-size: 0.75rem;
            color: #cbd5e1;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="hub-container">
        <div class="hub-header">
            <h1>D-MAX HUB</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search apps & websites..." autocomplete="off">
            </div>
        </div>

        <div class="app-grid" id="appGrid">
            <!-- Apps will load dynamically via script.js -->
        </div>
    </div>

    <!-- Link your JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
